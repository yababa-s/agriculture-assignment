# Weekly maintenance run (manual "Run workflow" also works): source health check, licence check,
# rules-only re-extraction of the price tables into a scratch database, and evaluation. Results are
# uploaded as a workflow artifact for review before anything is copied into the released database.
name: scheduled-update
on:
  schedule:
    - cron: "30 3 * * 1"      # Mondays 03:30 UTC (09:00 IST)
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/fetch_artifacts.py --only database corpus
      - name: Source health check (HTTP status of every document_url, polite: 1 request / 2 s)
        run: python scripts/check_sources.py --out logs/source_health.json
      - run: python -m agri.cli check-licenses
      - run: python scripts/run_pipeline.py --docs D11 D12 D13 --no-llm --db db/scheduled_scratch.sqlite
      - run: python scripts/eval_fields.py --db db/34_AN_knowledgebase_v2.sqlite --label scheduled
      - uses: actions/upload-artifact@v4
        with:
          name: scheduled-update-${{ github.run_id }}
          path: |
            logs/source_health.json
            logs/batch_*.json
            eval/results/phase3/field_eval_scheduled.json
